<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מעקב חתונות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary: #2B1A6B;
  --primary-light: #3D2A8A;
  --gold: #C9A84C;
  --gold-light: #F0D080;
  --bg: #F2F0EC;
  --card: #FFFFFF;
  --text: #1A1A2E;
  --text-2: #6B6B8A;
  --border: #E5E3DE;
  --shadow: 0 1px 4px rgba(0,0,0,0.07);
}

body { font-family: 'Heebo', sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; }

/* ─── Header ─────────────────────────────────────────────────────── */
.header {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
  padding: 0 24px;
  height: 60px;
  display: flex; align-items: center; justify-content: space-between;
}
.logo { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; }
.logo-box { width: 34px; height: 34px; background: var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; }

/* Desktop nav in header */
.header-nav { display: flex; gap: 4px; }
.hn-btn { padding: 7px 16px; border-radius: 8px; border: none; background: none; cursor: pointer; font-family: 'Heebo', sans-serif; font-size: 14px; font-weight: 500; color: var(--text-2); transition: all 150ms; }
.hn-btn:hover { background: var(--bg); color: var(--text); }
.hn-btn.active { background: var(--primary); color: white; }

/* ─── Layout ─────────────────────────────────────────────────────── */
.app { max-width: 1200px; margin: 0 auto; padding: 28px 24px; }

/* Dashboard: left column + right sidebar */
.dash-grid { display: grid; grid-template-columns: 1fr 340px; gap: 20px; }

/* ─── Hero ───────────────────────────────────────────────────────── */
.hero {
  background: var(--primary); border-radius: 18px; padding: 28px 24px;
  position: relative; overflow: hidden; margin-bottom: 16px;
}
.hero::before { content: ''; position: absolute; top: -50px; left: -50px; width: 180px; height: 180px; background: rgba(255,255,255,0.04); border-radius: 50%; }
.hero-label { font-size: 13px; color: rgba(255,255,255,0.55); font-weight: 500; margin-bottom: 8px; letter-spacing: .4px; }
.hero-amount { font-size: 54px; font-weight: 800; color: var(--gold-light); line-height: 1; letter-spacing: -2px; position: relative; z-index: 1; }
.hero-amount span { font-size: 34px; }

/* ─── Stat cards ─────────────────────────────────────────────────── */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
.stat { background: var(--card); border-radius: 14px; padding: 18px 14px; text-align: center; box-shadow: var(--shadow); }
.stat-val { font-size: 34px; font-weight: 800; color: var(--gold); line-height: 1; margin-bottom: 4px; }
.stat-lbl { font-size: 12px; color: var(--text-2); font-weight: 500; }

/* ─── Card ───────────────────────────────────────────────────────── */
.card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.card-hd { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.card-title { font-size: 13px; font-weight: 700; color: var(--text); text-transform: uppercase; letter-spacing: .05em; }
.card-link { font-size: 13px; color: var(--text-2); background: none; border: none; cursor: pointer; font-family: inherit; }
.card-link:hover { color: var(--primary); }
.card-body { padding: 16px 20px; }

/* ─── Calendar ───────────────────────────────────────────────────── */
.fc { font-family: 'Heebo', sans-serif !important; font-size: 13px; }
.fc .fc-toolbar-title { font-size: 15px !important; font-weight: 700 !important; }
.fc .fc-button { background: var(--bg) !important; border: none !important; color: var(--text) !important; border-radius: 8px !important; padding: 5px 10px !important; box-shadow: none !important; font-family: 'Heebo', sans-serif !important; }
.fc .fc-button:hover { background: var(--border) !important; }
.fc .fc-col-header-cell-cushion { color: var(--text-2) !important; font-size: 11px !important; font-weight: 600 !important; text-decoration: none !important; }
.fc .fc-daygrid-day-number { color: var(--text) !important; text-decoration: none !important; font-size: 12px !important; }
.fc .fc-day-today { background: rgba(201,168,76,0.07) !important; }
.fc .fc-day-today .fc-daygrid-day-number { font-weight: 700 !important; color: var(--gold) !important; }
.fc .fc-daygrid-event { border-radius: 5px !important; font-size: 11px !important; }
.fc td, .fc th { border-color: var(--border) !important; }
.fc .fc-scrollgrid { border: none !important; }
.fc .fc-scrollgrid-section > td { border: none !important; }

/* ─── WhatsApp CTA ───────────────────────────────────────────────── */
.whatsapp-cta { background: var(--primary); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
.cta-title { font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
.cta-desc { font-size: 13px; color: rgba(255,255,255,0.55); line-height: 1.55; margin-bottom: 14px; }
.cta-num { font-size: 20px; font-weight: 800; color: var(--gold-light); direction: ltr; display: block; margin-bottom: 2px; }
.cta-sub { font-size: 11px; color: rgba(255,255,255,0.35); }

/* ─── Wedding item ───────────────────────────────────────────────── */
.w-item { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border); }
.w-item:last-child { border-bottom: none; }
.w-avatar { width: 44px; height: 44px; border-radius: 12px; background: var(--bg); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.w-info { flex: 1; min-width: 0; }
.w-name { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
.w-date { font-size: 12px; color: var(--text-2); }
.w-badge { font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 100px; white-space: nowrap; flex-shrink: 0; }
.w-badge-money { background: var(--primary); color: var(--gold-light); }
.w-badge-pending { background: #FFF8E7; color: #B8870B; }
.w-del { width: 28px; height: 28px; flex-shrink: 0; background: none; border: none; cursor: pointer; color: #ccc; border-radius: 6px; font-size: 13px; transition: all 150ms; }
.w-del:hover { background: #fee2e2; color: #ef4444; }

/* ─── Empty ──────────────────────────────────────────────────────── */
.empty { text-align: center; padding: 40px 20px; }
.empty-icon { font-size: 36px; margin-bottom: 10px; }
.empty-title { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
.empty-desc { font-size: 13px; color: var(--text-2); line-height: 1.6; }

/* ─── Pages (non-dashboard) ──────────────────────────────────────── */
.page { display: none; }
.page.active { display: block; }

/* ─── Mobile only ────────────────────────────────────────────────── */
@media (max-width: 767px) {
  .header-nav { display: none; }
  body { padding-bottom: 70px; }
  .app { padding: 16px; }
  .dash-grid { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(3, 1fr); }
  .hero-amount { font-size: 44px; }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; height: 70px;
    background: var(--card); border-top: 1px solid var(--border);
    display: flex; align-items: stretch; z-index: 100;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .bn-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    background: none; border: none; cursor: pointer; color: var(--text-2);
    font-family: 'Heebo', sans-serif; font-size: 11px; font-weight: 500; padding-top: 6px;
  }
  .bn-btn.active { color: var(--primary); }
  .bn-btn span { font-size: 20px; }
}

@media (min-width: 768px) {
  .bottom-nav { display: none; }
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-box">💍</div>
    מעקב חתונות
  </div>
  <div class="header-nav">
    <button class="hn-btn active" onclick="showPage('dash')">📊 דשבורד</button>
    <button class="hn-btn" onclick="showPage('weddings')">💒 חתונות</button>
    <button class="hn-btn" onclick="showPage('budget')">💰 תקציב</button>
  </div>
  <div style="font-size:12px;color:var(--text-2)" id="lastUpdate"></div>
</div>

<div class="app">

  <!-- Dashboard -->
  <div id="dash" class="page active">
    <div class="dash-grid">
      <div>
        <div class="hero">
          <div class="hero-label">סה"כ תקציב</div>
          <div class="hero-amount" id="heroAmt"><span>₪</span>0</div>
        </div>
        <div class="stats">
          <div class="stat"><div class="stat-val" id="s1">0</div><div class="stat-lbl">חתונות</div></div>
          <div class="stat"><div class="stat-val" id="s2">0</div><div class="stat-lbl">קרובות</div></div>
          <div class="stat"><div class="stat-val" id="s3">₪0</div><div class="stat-lbl">ממוצע</div></div>
        </div>
        <div class="card">
          <div class="card-hd"><span class="card-title">לוח שנה</span></div>
          <div class="card-body"><div id="cal"></div></div>
        </div>
      </div>
      <div>
        <div class="whatsapp-cta">
          <div class="cta-title">שלח הזמנה לבוט</div>
          <div class="cta-desc">העבר הזמנת חתונה לבוט — הוא ינתח ויוסיף ללוח.</div>
          <span class="cta-num">+1 (662) 344-5081</span>
          <span class="cta-sub">WhatsApp Business</span>
        </div>
        <div class="card">
          <div class="card-hd">
            <span class="card-title">חתונות אחרונות</span>
            <button class="card-link" onclick="showPage('weddings')">הכל</button>
          </div>
          <div class="card-body" id="preview"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Weddings -->
  <div id="weddings" class="page">
    <div class="card" style="margin-top:4px">
      <div class="card-hd">
        <span class="card-title">כל החתונות</span>
        <span id="wCount" style="font-size:12px;color:var(--text-2)"></span>
      </div>
      <div class="card-body" id="wList"></div>
    </div>
  </div>

  <!-- Budget -->
  <div id="budget" class="page">
    <div class="hero" style="margin-bottom:16px;margin-top:4px">
      <div class="hero-label">סה"כ הוצאות</div>
      <div class="hero-amount" id="budgetAmt"><span>₪</span>0</div>
    </div>
    <div class="card">
      <div class="card-hd"><span class="card-title">פירוט</span></div>
      <div class="card-body" id="budgetList"></div>
    </div>
  </div>

</div>

<!-- Mobile bottom nav -->
<nav class="bottom-nav">
  <button class="bn-btn active" id="mn-dash" onclick="showPage('dash')"><span>📊</span>דשבורד</button>
  <button class="bn-btn" id="mn-weddings" onclick="showPage('weddings')"><span>💒</span>חתונות</button>
  <button class="bn-btn" id="mn-budget" onclick="showPage('budget')"><span>💰</span>תקציב</button>
</nav>

<script>
let weddings = [];

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  // Desktop nav
  document.querySelectorAll('.hn-btn').forEach((b,i) => b.classList.toggle('active', ['dash','weddings','budget'][i] === id));
  // Mobile nav
  ['dash','weddings','budget'].forEach(p => document.getElementById('mn-'+p)?.classList.toggle('active', p===id));
  window.scrollTo(0,0);
}

const fmtDate = d => d ? new Date(d).toLocaleDateString('he-IL',{day:'numeric',month:'long',year:'numeric'}) : 'תאריך לא ידוע';
const fmtMoney = n => n ? '₪' + n.toLocaleString('he-IL') : null;

function wHTML(w, del=true) {
  const badge = w.giftAmount
    ? `<span class="w-badge w-badge-money">${fmtMoney(w.giftAmount)}</span>`
    : `<span class="w-badge w-badge-pending">ממתין</span>`;
  const delBtn = del ? `<button class="w-del" onclick="remove('${w.id}')">✕</button>` : '';
  return `<div class="w-item">
    <div class="w-avatar">💒</div>
    <div class="w-info">
      <div class="w-name">${w.names}</div>
      <div class="w-date">📅 ${fmtDate(w.date)}${w.location?' · 📍'+w.location:''}</div>
    </div>
    ${badge}${delBtn}
  </div>`;
}

function render() {
  const now = new Date();
  const sorted = [...weddings].sort((a,b)=>(a.date||'')<(b.date||'')?-1:1);
  const total = weddings.reduce((s,w)=>s+(w.giftAmount||0),0);
  const upcoming = weddings.filter(w=>w.date&&new Date(w.date)>=now).length;
  const withGift = weddings.filter(w=>w.giftAmount);
  const avg = withGift.length ? Math.round(total/withGift.length) : 0;

  document.getElementById('heroAmt').innerHTML = `<span>₪</span>${total.toLocaleString('he-IL')}`;
  document.getElementById('budgetAmt').innerHTML = `<span>₪</span>${total.toLocaleString('he-IL')}`;
  document.getElementById('s1').textContent = weddings.length;
  document.getElementById('s2').textContent = upcoming;
  document.getElementById('s3').textContent = avg ? '₪'+avg.toLocaleString('he-IL') : '₪0';
  document.getElementById('wCount').textContent = weddings.length + ' חתונות';
  document.getElementById('lastUpdate').textContent = 'עדכון ' + new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});

  const emptyHTML = `<div class="empty"><div class="empty-icon">💌</div><div class="empty-title">אין חתונות</div><div class="empty-desc">שלח הזמנה לבוט</div></div>`;

  document.getElementById('preview').innerHTML = sorted.length ? sorted.slice(0,4).map(w=>wHTML(w,false)).join('') : emptyHTML;
  document.getElementById('wList').innerHTML = sorted.length ? sorted.map(w=>wHTML(w)).join('') : emptyHTML;
  document.getElementById('budgetList').innerHTML = withGift.length
    ? sorted.filter(w=>w.giftAmount).map(w=>`<div class="w-item">
        <div class="w-avatar">💰</div>
        <div class="w-info"><div class="w-name">${w.names}</div><div class="w-date">${fmtDate(w.date)}</div></div>
        <span class="w-badge w-badge-money">${fmtMoney(w.giftAmount)}</span>
      </div>`).join('')
    : emptyHTML;

  if (window._cal) window._cal.destroy();
  window._cal = new FullCalendar.Calendar(document.getElementById('cal'), {
    initialView: 'dayGridMonth', locale: 'he', direction: 'rtl', height: 340,
    headerToolbar: { start: 'prev,next', center: 'title', end: '' },
    events: weddings.filter(w=>w.date).map(w=>({
      id:w.id, title:w.names, date:w.date,
      backgroundColor:'#2B1A6B', borderColor:'#2B1A6B', textColor:'#F0D080'
    })),
    eventClick: i => {
      const w = weddings.find(x=>x.id===i.event.id);
      if(w) alert(`💒 ${w.names}\n📅 ${fmtDate(w.date)}${w.location?'\n📍'+w.location:''}\n💰 ${w.giftAmount?fmtMoney(w.giftAmount):'לא הוגדר'}`);
    }
  });
  window._cal.render();
}

async function remove(id) {
  if (!confirm('למחוק?')) return;
  await fetch(`/api/weddings/${id}`,{method:'DELETE'});
  load();
}

async function load() {
  try {
    const res = await fetch('/api/weddings');
    weddings = await res.json();
    render();
  } catch(e){console.error(e);}
}

load();
setInterval(load, 15000);
</script>
</body>
</html>
